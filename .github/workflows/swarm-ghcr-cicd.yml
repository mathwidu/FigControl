name: CI/CD FigControl (GHCR + Swarm)

on:
  push:
    branches:
      - dev
      - prod
  pull_request:
    branches:
      - dev
      - prod
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://figcontrol_user:figcontrol_password@localhost:5432/figcontrol_db?schema=public
        run: npm run prisma:generate --workspace apps/api

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          DATABASE_URL: postgresql://figcontrol_user:figcontrol_password@localhost:5432/figcontrol_db?schema=public
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: npm run build

  build_and_push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy variables
        id: resolve
        env:
          GHCR_IMAGE_REPO_API: ${{ vars.GHCR_IMAGE_REPO_API }}
          GHCR_IMAGE_REPO_WEB: ${{ vars.GHCR_IMAGE_REPO_WEB }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          DEFAULT_REPO="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          API_REPO="${GHCR_IMAGE_REPO_API:-${DEFAULT_REPO}-api}"
          WEB_REPO="${GHCR_IMAGE_REPO_WEB:-${DEFAULT_REPO}-web}"
          API_REPO="${API_REPO#ghcr.io/}"
          WEB_REPO="${WEB_REPO#ghcr.io/}"

          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            CHANNEL="dev"
            API_SERVICE="figcontrol-dev_api"
            WEB_SERVICE="figcontrol-dev_web"
            NEXT_PUBLIC_API_URL="https://figcontrol-api-dev.matheusduarte.dev.br"
          elif [ "${GITHUB_REF_NAME}" = "prod" ]; then
            CHANNEL="prod"
            API_SERVICE="figcontrol-prod_api"
            WEB_SERVICE="figcontrol-prod_web"
            NEXT_PUBLIC_API_URL="https://figcontrol-api.matheusduarte.dev.br"
          else
            echo "Branch nao suportada: ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "api_image=${REGISTRY}/${API_REPO}:${CHANNEL}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "api_latest=${REGISTRY}/${API_REPO}:${CHANNEL}-latest" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${WEB_REPO}:${CHANNEL}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_latest=${REGISTRY}/${WEB_REPO}:${CHANNEL}-latest" >> "$GITHUB_OUTPUT"
          echo "api_service=${API_SERVICE}" >> "$GITHUB_OUTPUT"
          echo "web_service=${WEB_SERVICE}" >> "$GITHUB_OUTPUT"
          echo "next_public_api_url=${NEXT_PUBLIC_API_URL}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate GHCR push secrets
        env:
          GHCR_PUSH_USERNAME: ${{ secrets.GHCR_PUSH_USERNAME }}
          GHCR_PUSH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN }}
        run: |
          [ -n "${GHCR_PUSH_USERNAME}" ] || { echo "GHCR_PUSH_USERNAME vazio"; exit 1; }
          [ -n "${GHCR_PUSH_TOKEN}" ] || { echo "GHCR_PUSH_TOKEN vazio"; exit 1; }

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_PUSH_USERNAME }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.resolve.outputs.api_image }}
            ${{ steps.resolve.outputs.api_latest }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.resolve.outputs.next_public_api_url }}
          tags: |
            ${{ steps.resolve.outputs.web_image }}
            ${{ steps.resolve.outputs.web_latest }}

  deploy_swarm:
    runs-on: ubuntu-latest
    needs: build_and_push
    if: github.event_name == 'push'

    steps:
      - name: Validate deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          GHCR_READ_USERNAME: ${{ secrets.GHCR_READ_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          [ -n "${VPS_HOST}" ] || { echo "VPS_HOST vazio"; exit 1; }
          [ -n "${VPS_USER}" ] || { echo "VPS_USER vazio"; exit 1; }
          [ -n "${GHCR_READ_USERNAME}" ] || { echo "GHCR_READ_USERNAME vazio"; exit 1; }
          [ -n "${GHCR_READ_TOKEN}" ] || { echo "GHCR_READ_TOKEN vazio"; exit 1; }
          DEPLOY_KEY="${VPS_SSH_KEY:-${VPS_SSH_PRIVATE_KEY:-}}"
          [ -n "${DEPLOY_KEY}" ] || { echo "VPS_SSH_KEY/VPS_SSH_PRIVATE_KEY vazio"; exit 1; }
          echo "${DEPLOY_KEY}" | grep -q "BEGIN .*PRIVATE KEY" || {
            echo "Chave SSH invalida: use a chave privada completa.";
            exit 1;
          }

      - name: Resolve deploy variables
        id: resolve
        env:
          GHCR_IMAGE_REPO_API: ${{ vars.GHCR_IMAGE_REPO_API }}
          GHCR_IMAGE_REPO_WEB: ${{ vars.GHCR_IMAGE_REPO_WEB }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          DEFAULT_REPO="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          API_REPO="${GHCR_IMAGE_REPO_API:-${DEFAULT_REPO}-api}"
          WEB_REPO="${GHCR_IMAGE_REPO_WEB:-${DEFAULT_REPO}-web}"
          API_REPO="${API_REPO#ghcr.io/}"
          WEB_REPO="${WEB_REPO#ghcr.io/}"

          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            CHANNEL="dev"
            API_SERVICE="figcontrol-dev_api"
            WEB_SERVICE="figcontrol-dev_web"
          elif [ "${GITHUB_REF_NAME}" = "prod" ]; then
            CHANNEL="prod"
            API_SERVICE="figcontrol-prod_api"
            WEB_SERVICE="figcontrol-prod_web"
          else
            echo "Branch nao suportada: ${GITHUB_REF_NAME}"
            exit 1
          fi

          echo "api_image=${REGISTRY}/${API_REPO}:${CHANNEL}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_image=${REGISTRY}/${WEB_REPO}:${CHANNEL}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "api_service=${API_SERVICE}" >> "$GITHUB_OUTPUT"
          echo "web_service=${WEB_SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Docker Swarm on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ secrets.GHCR_READ_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          API_IMAGE: ${{ steps.resolve.outputs.api_image }}
          WEB_IMAGE: ${{ steps.resolve.outputs.web_image }}
          API_SERVICE: ${{ steps.resolve.outputs.api_service }}
          WEB_SERVICE: ${{ steps.resolve.outputs.web_service }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,API_IMAGE,WEB_IMAGE,API_SERVICE,WEB_SERVICE
          script_stop: true
          script: |
            set -euo pipefail
            [ -n "${GHCR_USER}" ] || { echo "GHCR_READ_USERNAME vazio"; exit 1; }
            [ -n "${GHCR_TOKEN}" ] || { echo "GHCR_READ_TOKEN vazio"; exit 1; }
            [ -n "${API_IMAGE}" ] || { echo "API_IMAGE vazio"; exit 1; }
            [ -n "${WEB_IMAGE}" ] || { echo "WEB_IMAGE vazio"; exit 1; }
            [ -n "${API_SERVICE}" ] || { echo "API_SERVICE vazio"; exit 1; }
            [ -n "${WEB_SERVICE}" ] || { echo "WEB_SERVICE vazio"; exit 1; }

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker pull "${API_IMAGE}"
            docker pull "${WEB_IMAGE}"
            docker service inspect "${API_SERVICE}" >/dev/null 2>&1 || {
              echo "Service ${API_SERVICE} nao encontrado.";
              docker service ls;
              exit 1;
            }
            docker service inspect "${WEB_SERVICE}" >/dev/null 2>&1 || {
              echo "Service ${WEB_SERVICE} nao encontrado.";
              docker service ls;
              exit 1;
            }
            docker service update --image "${API_IMAGE}" --with-registry-auth --detach=false "${API_SERVICE}"
            docker service update --image "${WEB_IMAGE}" --with-registry-auth --detach=false "${WEB_SERVICE}"
            docker service inspect "${API_SERVICE}" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'
            docker service inspect "${WEB_SERVICE}" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'

  smoke_deploy:
    runs-on: ubuntu-latest
    needs: deploy_swarm
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve smoke URLs
        id: smoke
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "web_url=https://figcontrol-dev.matheusduarte.dev.br" >> "$GITHUB_OUTPUT"
            echo "api_url=https://figcontrol-api-dev.matheusduarte.dev.br" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "prod" ]; then
            echo "web_url=https://figcontrol.matheusduarte.dev.br" >> "$GITHUB_OUTPUT"
            echo "api_url=https://figcontrol-api.matheusduarte.dev.br" >> "$GITHUB_OUTPUT"
          else
            echo "Branch nao suportada: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Run smoke checks
        env:
          FIGCONTROL_SMOKE_WEB_URL: ${{ steps.smoke.outputs.web_url }}
          FIGCONTROL_SMOKE_API_URL: ${{ steps.smoke.outputs.api_url }}
          FIGCONTROL_SMOKE_EMAIL: ${{ secrets.FIGCONTROL_SMOKE_EMAIL }}
          FIGCONTROL_SMOKE_PASSWORD: ${{ secrets.FIGCONTROL_SMOKE_PASSWORD }}
        run: bash scripts/smoke-figcontrol.sh
