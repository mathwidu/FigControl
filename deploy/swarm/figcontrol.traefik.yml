version: "3.8"

services:
  api:
    image: ghcr.io/mathwidu/figcontrol-api:prod-latest
    environment:
      PORT: "3001"
      DATABASE_URL_FILE: /run/secrets/figcontrol_database_url_v1
      JWT_ACCESS_SECRET_FILE: /run/secrets/figcontrol_jwt_access_secret_v1
      JWT_REFRESH_SECRET_FILE: /run/secrets/figcontrol_jwt_refresh_secret_v1
      JWT_ACCESS_TTL_SECONDS: "900"
      JWT_REFRESH_TTL_SECONDS: "2592000"
      FIGCONTROL_EMAIL_PROVIDER: "resend"
      FIGCONTROL_EMAIL_FROM: "FigControl <noreply@notifications.matheusduarte.dev.br>"
      FIGCONTROL_EMAIL_RESEND_API_KEY_FILE: "/run/secrets/figcontrol_resend_api_key_v1"
      FIGCONTROL_WEB_URL: "https://figcontrol.matheusduarte.dev.br"
      FIGCONTROL_EMAIL_VERIFICATION_TOKEN_TTL_MINUTES: "1440"
      FIGCONTROL_EMAIL_VERIFICATION_RESEND_COOLDOWN_MINUTES: "15"
      FIGCONTROL_PASSWORD_RESET_TOKEN_TTL_MINUTES: "60"
      FIGCONTROL_PASSWORD_RESET_RESEND_COOLDOWN_MINUTES: "5"
      FIGCONTROL_ADMIN_EMAILS: "${FIGCONTROL_ADMIN_EMAILS}"
      CORS_ORIGIN: "https://figcontrol.matheusduarte.dev.br"
    secrets:
      - figcontrol_database_url_v1
      - figcontrol_jwt_access_secret_v1
      - figcontrol_jwt_refresh_secret_v1
      - figcontrol_resend_api_key_v1
    networks:
      - network_swarm_public
    deploy:
      replicas: 1
      update_config:
        order: start-first
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_swarm_public"
        - "traefik.http.routers.figcontrol-api.rule=Host(`figcontrol-api.matheusduarte.dev.br`)"
        - "traefik.http.routers.figcontrol-api.entrypoints=websecure"
        - "traefik.http.routers.figcontrol-api.tls=true"
        - "traefik.http.routers.figcontrol-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.figcontrol-api.loadbalancer.server.port=3001"

  web:
    image: ghcr.io/mathwidu/figcontrol-web:prod-latest
    networks:
      - network_swarm_public
    deploy:
      replicas: 1
      update_config:
        order: start-first
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_swarm_public"
        - "traefik.http.routers.figcontrol-web.rule=Host(`figcontrol.matheusduarte.dev.br`)"
        - "traefik.http.routers.figcontrol-web.entrypoints=websecure"
        - "traefik.http.routers.figcontrol-web.tls=true"
        - "traefik.http.routers.figcontrol-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.figcontrol-web.loadbalancer.server.port=3000"

networks:
  network_swarm_public:
    external: true

secrets:
  figcontrol_database_url_v1:
    external: true
  figcontrol_jwt_access_secret_v1:
    external: true
  figcontrol_jwt_refresh_secret_v1:
    external: true
  figcontrol_resend_api_key_v1:
    external: true
